services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-content_factory}
      MYSQL_USER: ${MYSQL_USER:-factory}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-factory}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-content_factory}
      HOST: 0.0.0.0
      PORT: ${PORT:-8060}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:${PROD_PORT:-8060}}
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      STORAGE_PATH: /app/storage
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "${PORT:-8060}"
    volumes:
      - asset-data:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  frontend:
    environment:
      BACKEND_PORT: ${PORT:-8060}
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${PROD_PORT:-8060}:80"
volumes:
  mysql-data:
  asset-data:
